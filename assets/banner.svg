<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="360" style="background:#0b0f19;border-radius:16px;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="50%" stop-color="#0e172a" />
      <stop offset="100%" stop-color="#060913" />
    </linearGradient>

    <linearGradient id="primary-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="accent-cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.2" />
    </linearGradient>

    <linearGradient id="card-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.75" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.85" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="18" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="soft-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    /* CSS Keyframe Animations */
    @keyframes pulseOrb {
      0%, 100% { transform: scale(1) translate(0, 0); opacity: 0.35; }
      50% { transform: scale(1.15) translate(20px, -15px); opacity: 0.6; }
    }
    @keyframes floatPill1 {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-10px); }
    }
    @keyframes floatPill2 {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(12px); }
    }
    @keyframes floatPill3 {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-8px); }
    }
    @keyframes beamFlow {
      0% { stroke-dashoffset: 400; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes nodeBlink {
      0%, 100% { opacity: 0.3; transform: scale(0.9); }
      50% { opacity: 1; transform: scale(1.2); }
    }

    .bg-orb-1 { animation: pulseOrb 8s ease-in-out infinite; transform-origin: 200px 100px; }
    .bg-orb-2 { animation: pulseOrb 10s ease-in-out infinite reverse; transform-origin: 1000px 250px; }
    .pill-1 { animation: floatPill1 6s ease-in-out infinite; }
    .pill-2 { animation: floatPill2 7s ease-in-out infinite; }
    .pill-3 { animation: floatPill3 5.5s ease-in-out infinite; }
    .flow-line { stroke-dasharray: 12, 12; animation: beamFlow 15s linear infinite; }
    .node-dot-1 { animation: nodeBlink 3s ease-in-out infinite; }
    .node-dot-2 { animation: nodeBlink 3s ease-in-out infinite 1.5s; }
  </style>

  <!-- Deep Background -->
  <rect width="100%" height="100%" fill="url(#bg-grad)" />

  <!-- Animated Ambient Nebula Glows -->
  <circle class="bg-orb-1" cx="220" cy="90" r="140" fill="#38bdf8" filter="url(#glow)" />
  <circle class="bg-orb-2" cx="1000" cy="240" r="160" fill="#818cf8" filter="url(#glow)" />
  <circle cx="600" cy="340" r="130" fill="#c084fc" opacity="0.18" filter="url(#glow)" />

  <!-- Decorative Tech Grid Background -->
  <g opacity="0.1" stroke="#94a3b8" stroke-width="1">
    <line x1="100" y1="0" x2="100" y2="360" />
    <line x1="300" y1="0" x2="300" y2="360" />
    <line x1="500" y1="0" x2="500" y2="360" />
    <line x1="700" y1="0" x2="700" y2="360" />
    <line x1="900" y1="0" x2="900" y2="360" />
    <line x1="1100" y1="0" x2="1100" y2="360" />
    <line x1="0" y1="90" x2="1200" y2="90" />
    <line x1="0" y1="180" x2="1200" y2="180" />
    <line x1="0" y1="270" x2="1200" y2="270" />
  </g>

  <!-- Dynamic Knowledge Flow Synapse Lines -->
  <g fill="none" opacity="0.45">
    <path class="flow-line" d="M 80,60 C 260,30 380,120 540,70" stroke="#38bdf8" stroke-width="2" />
    <path class="flow-line" d="M 680,80 C 820,30 960,110 1120,60" stroke="#818cf8" stroke-width="2" />
    <path class="flow-line" d="M 120,300 C 320,340 450,280 620,310" stroke="#c084fc" stroke-width="2" />
    <path class="flow-line" d="M 720,310 C 880,350 1020,290 1140,320" stroke="#38bdf8" stroke-width="2" />
  </g>

  <!-- Dynamic Floating Feature Pills (Background-Midground) -->
  <g class="pill-1">
    <g transform="translate(60, 48)">
      <rect width="180" height="34" rx="17" fill="url(#card-grad)" stroke="#38bdf8" stroke-width="1.2" stroke-opacity="0.6"/>
      <circle class="node-dot-1" cx="20" cy="17" r="4" fill="#38bdf8" />
      <text x="34" y="22" fill="#e2e8f0" font-size="12" font-weight="600" letter-spacing="0.5">🧠 AI &amp; RAG Knowledge</text>
    </g>
  </g>

  <g class="pill-2">
    <g transform="translate(940, 48)">
      <rect width="195" height="34" rx="17" fill="url(#card-grad)" stroke="#818cf8" stroke-width="1.2" stroke-opacity="0.6"/>
      <circle class="node-dot-2" cx="20" cy="17" r="4" fill="#818cf8" />
      <text x="34" y="22" fill="#e2e8f0" font-size="12" font-weight="600" letter-spacing="0.5">⚡ Self-Hosted &amp; Open</text>
    </g>
  </g>

  <g class="pill-3">
    <g transform="translate(950, 280)">
      <rect width="185" height="34" rx="17" fill="url(#card-grad)" stroke="#c084fc" stroke-width="1.2" stroke-opacity="0.6"/>
      <circle class="node-dot-1" cx="20" cy="17" r="4" fill="#c084fc" />
      <text x="34" y="22" fill="#e2e8f0" font-size="12" font-weight="600" letter-spacing="0.5">📚 Docs-as-Code Wikis</text>
    </g>
  </g>

  <g class="pill-1">
    <g transform="translate(70, 280)">
      <rect width="175" height="34" rx="17" fill="url(#card-grad)" stroke="#38bdf8" stroke-width="1.2" stroke-opacity="0.6"/>
      <circle class="node-dot-2" cx="20" cy="17" r="4" fill="#34d399" />
      <text x="34" y="22" fill="#e2e8f0" font-size="12" font-weight="600" letter-spacing="0.5">🔒 Enterprise Security</text>
    </g>
  </g>

  <!-- Center Focal Container: Glassmorphism Card (Keeps Foreground Untouchable) -->
  <g transform="translate(220, 95)">
    <rect width="760" height="170" rx="20" fill="#090d16" fill-opacity="0.88" stroke="url(#primary-grad)" stroke-width="1.8" filter="url(#soft-glow)" />

    <!-- Category Pill Badge -->
    <g transform="translate(265, 18)">
      <rect width="230" height="24" rx="12" fill="#1e1b4b" stroke="#6366f1" stroke-width="1" />
      <text x="115" y="16" fill="#a5b4fc" font-size="11" font-weight="700" text-anchor="middle" letter-spacing="1.2">CURATED AWESOME ECOSYSTEM</text>
    </g>

    <!-- Main Title -->
    <text x="380" y="85" text-anchor="middle" font-size="34" font-weight="900" fill="url(#primary-grad)" letter-spacing="-0.5">
      KNOWLEDGE MANAGEMENT &amp; WIKI
    </text>

    <!-- Subtitle -->
    <text x="380" y="122" text-anchor="middle" font-size="15" font-weight="500" fill="#cbd5e1" letter-spacing="0.4">
      SaaS Platforms • Open-Source Wikis • Self-Service Documentation • Internal Hubs
    </text>

    <!-- Micro Tags -->
    <text x="380" y="148" text-anchor="middle" font-size="12" font-weight="600" fill="#94a3b8" letter-spacing="1">
      NOTION • CONFLUENCE • OUTLINE • BOOKSTACK • WIKI.JS • APPFLOWY • AFFINE
    </text>
  </g>
</svg>
